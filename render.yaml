# Déploiement sur Render (offre gratuite), en un seul service : l'API sert aussi le site construit.
# Site et API à la même adresse (https://….onrender.com) : cookies de session simples, aucun CORS.
#   Base de données : Neon (Postgres gratuit, sans date d'expiration) → DATABASE_URL
#   Photos envoyées depuis l'administration : Cloudinary (gratuit) → CLOUDINARY_URL
#     (le disque d'un service gratuit Render est effacé à chaque redémarrage)
# Mode d'emploi pas à pas : DEPLOIEMENT.md
services:
  - type: web
    name: ab-tech
    runtime: node
    plan: free
    # le plus proche de l'Afrique de l'Ouest parmi les régions Render
    region: frankfurt
    # dépendances de développement installées pour la construction (Vite, TypeScript, tsup), puis :
    # site (vérification des types + Vite) → API (tsup) → fichiers précompressés (Brotli, gzip)
    buildCommand: NODE_ENV=development npx --yes pnpm@10.20.0 install --frozen-lockfile && npx --yes pnpm@10.20.0 run build:render
    # lancé depuis apps/api : migrations (./drizzle) puis serveur ; le site construit est dans ../web/dist
    startCommand: cd apps/api && NODE_ENV=production node dist/index.js
    healthCheckPath: /api/ping
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WEB_DIST
        value: ../web/dist
      # clé de signature des sessions et des liens : générée par Render
      - key: SESSION_SECRET
        generateValue: true
      # à renseigner à la création (voir DEPLOIEMENT.md)
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # administrateur initial, seulement si la base en ligne part de zéro (sinon : laisser vide)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
