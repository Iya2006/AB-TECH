# Déploiement sur Render (offre gratuite) : la base de données ET le site, créés et reliés automatiquement.
# Un seul service web : l'API sert aussi le site construit (même adresse : cookies de session simples, aucun CORS).
#   Base Postgres Render gratuite : 1 Go, EXPIRE 30 JOURS APRÈS SA CRÉATION (supprimée 14 jours plus tard
#   sans passage à une offre payante). Pour un essai. Au-delà : Neon (gratuit, sans expiration) ou hébergement payant.
#   Photos envoyées depuis l'administration : ajouter CLOUDINARY_URL (service → Environment) pour qu'elles restent ;
#   sans lui, elles sont effacées quand le service gratuit s'endort ou redémarre.
# Mode d'emploi pas à pas : DEPLOIEMENT.md
databases:
  - name: ab-tech-db
    plan: free
    region: frankfurt
    databaseName: abtech
    user: abtech
    # même version que le site local (Docker) : la copie du contenu local reste possible
    postgresMajorVersion: "17"

services:
  - type: web
    name: ab-tech
    runtime: node
    plan: free
    # la plus proche de l'Afrique de l'Ouest parmi les régions Render (la même que la base)
    region: frankfurt
    # dépendances de développement installées pour la construction (Vite, TypeScript, tsup), puis :
    # site (vérification des types + Vite) → API (tsup) → fichiers précompressés (Brotli, gzip)
    buildCommand: NODE_ENV=development npx --yes pnpm@10.20.0 install --frozen-lockfile && npx --yes pnpm@10.20.0 run build:render
    # lancé depuis apps/api : attente de la base, migrations (./drizzle), puis serveur ; le site construit est dans ../web/dist
    startCommand: cd apps/api && NODE_ENV=production node dist/index.js
    healthCheckPath: /api/ping
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WEB_DIST
        value: ../web/dist
      # clé de signature des sessions et des liens : générée par Render
      - key: SESSION_SECRET
        generateValue: true
      # adresse de la base Render (réseau privé), reliée automatiquement
      - key: DATABASE_URL
        fromDatabase:
          name: ab-tech-db
          property: connectionString
      # administrateur créé au premier démarrage (base vide) ; mot de passe de 10 caractères minimum,
      # à remplacer à la première connexion
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
