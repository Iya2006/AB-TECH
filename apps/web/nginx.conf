server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6m;
  server_tokens off;

  gzip on;
  # octet-stream : modèles 3D (.bin, .gltf) et éclairages (.hdr), qui se compressent de moitié environ
  gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream model/gltf+json;
  gzip_min_length 1024;
  gzip_comp_level 6;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    expires 30d;
  }

  # fichiers du site au nom unique (empreinte dans le nom) : gardés un an
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ressources 3D et photos : noms fixes, donc mises en cache sans « immutable » (elles peuvent être mises à jour)
  location /assets/ph/ {
    expires 30d;
    try_files $uri =404;
  }
  location /media/ {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
